

services:
  web:
    build: ./nginx
    ports:
      - ${NGINX_PORT}:80
    restart: always
    depends_on:
      - api
    networks:
      - pingerNetwork

  api:
    build:  ./back
    restart: always
    depends_on:
      - db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB} 
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
    networks:
      - pingerNetwork
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    depends_on:
      - api
    networks:
      - pingerNetwork
  db:
    image: postgres
    restart: always
    shm_size: 128mb
    # volumes:
    #   - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - pingerNetwork
  pinger:
    build: ./pinger
    environment:
      NGINX_PORT: ${NGINX_PORT}
    networks:
      - pingerNetwork
    depends_on:
      - api
      - db
      - web
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  
networks:
  pingerNetwork:
