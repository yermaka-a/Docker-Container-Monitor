

services:
  front:
    build: ./front
    ports:
      - ${FRONT_PORT}:81
    restart: always
    networks:
      - pingerNetwork
    depends_on:
      - api
      - web
  web:
    build: ./nginx
    ports:
      - ${NGINX_PORT}:80
    restart: always
    depends_on:
      - api
    networks:
      - pingerNetwork

  api:
    build:  ./back
    restart: always
    depends_on:
      - db
      - rabbitmq
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB} 
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      FRONT_PORT: ${FRONT_PORT}
    networks:
      - pingerNetwork
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    depends_on:
      - db
    networks:
      - pingerNetwork
  db:
    image: postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - pingerNetwork
  pinger:
    build: ./pinger
    networks:
      - pingerNetwork
    environment:
      PINGER_WAIT: ${PINGER_WAIT}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
    depends_on:
      - api
      - db
      - web
      - rabbitmq
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq1
    restart: always
    ports:
      - 5672:5672   
      - 15672:15672      
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    networks:
      - pingerNetwork

networks:
  pingerNetwork:
    driver: bridge